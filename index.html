<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solana Tactical DCA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <link rel="apple-touch-icon" href="logo.png">
  <style>
    :root {
      --bg-main: #0a0a0c;
      --bg-card: #16161a;
      --text-main: #ffffff;
      --text-muted: #9ca3af;
      --solana-gradient: linear-gradient(135deg, #00FFA3 0%, #DC1FFF 100%);
      --accent-green: #00FFA3;
      --accent-purple: #DC1FFF;
      --accent-warning: #f59e0b;
      --border: #26262b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .header-title-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .app-logo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
    }

    h1 {
      font-size: 1.25rem;
      background: var(--solana-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-card);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .asset-title {
      font-weight: bold;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      background: var(--solana-gradient);
      border-radius: 50%;
    }

    button {
      background: var(--solana-gradient);
      color: #000000;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .signal-box {
      text-align: center;
      padding: 20px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 20px;
      border: 2px solid var(--border);
    }

    .signal-dca {
      background-color: rgba(0, 255, 163, 0.1);
      color: var(--accent-green);
      border-color: var(--accent-green);
    }

    .signal-sell {
      background-color: rgba(220, 31, 255, 0.1);
      color: var(--accent-purple);
      border-color: var(--accent-purple);
    }

    .signal-cross-down {
      background-color: rgba(245, 158, 11, 0.15);
      color: var(--accent-warning);
      border-color: var(--accent-warning);
      animation: pulse 1.5s infinite;
    }

    .signal-neutral {
      background-color: rgba(156, 163, 175, 0.05);
      color: var(--text-muted);
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .dashboard-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card h2 {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .metric-value {
      font-size: 1.25rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title-container">
      <img src="logo.png" alt="Logo Solana" class="app-logo">
      <h1>Estrategia Táctica Solana</h1>
    </div>
    <div class="controls">
      <span class="asset-title"><span class="dot"></span> SOL / USD (1D)</span>
      <button id="analyzeBtn">Actualizar</button>
    </div>
  </header>

  <div id="signalDisplay" class="signal-box signal-neutral">
    CARGANDO DATOS...
  </div>

  <div class="dashboard-grid">
    <div class="card">
      <h2>Precio Actual</h2>
      <div id="currentPrice" class="metric-value">--</div>
    </div>
    <div class="card">
      <h2>EMA 200 (Tendencia)</h2>
      <div id="currentEma" class="metric-value">--</div>
    </div>
    <div class="card">
      <h2>RSI (14)</h2>
      <div id="currentRsi" class="metric-value">--</div>
    </div>
  </div>

  <!-- Importamos la librería technicalindicators directamente optimizada para navegador -->
  <script src="https://cdn.jsdelivr.net/npm/technicalindicators@3.1.0/dist/browser.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const analyzeBtn = document.getElementById('analyzeBtn');
      if (analyzeBtn) {
        analyzeBtn.addEventListener('click', fetchMarketData);
      }
      fetchMarketData();
    });

    async function fetchMarketData() {
      const signalBox = document.getElementById('signalDisplay');
      signalBox.className = "signal-box signal-neutral";
      signalBox.innerText = "DESCARGANDO DATOS DE SOLANA...";

      const url = 'https://api.binance.com/api/v3/klines?symbol=SOLUSDT&interval=1d&limit=1000';

      try {
        const response = await fetch(url);
        const data = await response.json();
        
        if (!Array.isArray(data) || data.length === 0) {
          throw new Error("No hay datos disponibles");
        }

        const closedCandles = data.slice(0, data.length - 1);
        const closes = closedCandles.map(candle => parseFloat(candle[4]));
        const volumes = closedCandles.map(candle => parseFloat(candle[5]));

        runStrategy(closes, volumes);
      } catch (error) {
        console.error("Error al obtener datos:", error);
        signalBox.innerText = "ERROR DE RED. INTENTA DE NUEVO";
      }
    }

    function runStrategy(closes, volumes) {
      // Uso de la librería technicalindicators cargada en el navegador
      const ema200Arr = window.technicalindicators.EMA.calculate({ period: 200, values: closes });
      const rsiArr = window.technicalindicators.RSI.calculate({ period: 14, values: closes });
      const obvArr = window.technicalindicators.OBV.calculate({ close: closes, volume: volumes });
      const obvEmaArr = window.technicalindicators.EMA.calculate({ period: 205, values: obvArr }); // Equivale a la EMA del OBV

      const currentClose = closes[closes.length - 1];
      const prevClose = closes[closes.length - 2];
      
      // Ajuste de índices por el desfase inicial de calentamiento de la librería
      const currentEma = ema200Arr[ema200Arr.length - 1];
      const prevEma = ema200Arr[ema200Arr.length - 2];
      
      const currentRsi = rsiArr[rsiArr.length - 1];
      
      const prevObv = obvArr[obvArr.length - 2];
      const prevObvEma = obvEmaArr[obvEmaArr.length - 2];
      const currObv = obvArr[obvArr.length - 1];
      const currObvEma = obvEmaArr[obvEmaArr.length - 1];
      
      const obvCrossover = prevObv <= prevObvEma && currObv > currObvEma;
      const crossedBelowEma = prevClose >= prevEma && currentClose < currentEma;

      const isDowntrend = currentClose < currentEma;
      const condBuyDca = isDowntrend && currentRsi < 30;
      const condSell = obvCrossover;

      document.getElementById('currentPrice').innerText = `$${currentClose.toFixed(2)}`;
      document.getElementById('currentEma').innerText = `$${currentEma.toFixed(2)}`;
      document.getElementById('currentRsi').innerText = currentRsi.toFixed(2);
      
      const signalBox = document.getElementById('signalDisplay');
      
      if (crossedBelowEma) {
        signalBox.className = "signal-box signal-cross-down";
        signalBox.innerText = "⚠️ ¡ALERTA: CRUCE BAJISTA DE EMA 200 DETECTADO!";
      } else if (condBuyDca) {
        signalBox.className = "signal-box signal-dca";
        signalBox.innerText = "🚨 SEÑAL ACTIVA: INICIAR DCA (COMPRAR)";
      } else if (condSell) {
        signalBox.className = "signal-box signal-sell";
        signalBox.innerText = "🚨 SEÑAL ACTIVA: VENDER / SALIR";
      } else {
        signalBox.className = "signal-box signal-neutral";
        signalBox.innerText = "⏳ MERCADO NEUTRAL (ESPERANDO CONDICIONES)";
      }
    }
  </script>
</body>
</html>
