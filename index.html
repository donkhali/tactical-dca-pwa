<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tactical DCA Strategy PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #22c55e;
      --accent-blue: #3b82f6;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    h1 {
      font-size: 1.25rem;
      color: var(--text-main);
      text-align: center;
    }

    .controls {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    select, button {
      background-color: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }

    select {
      flex: 2;
    }

    button {
      flex: 1;
      background-color: var(--accent-blue);
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .signal-box {
      text-align: center;
      padding: 20px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 20px;
      border: 2px solid var(--border);
    }

    .signal-dca {
      background-color: rgba(34, 197, 94, 0.15);
      color: var(--accent-green);
      border-color: var(--accent-green);
    }

    .signal-sell {
      background-color: rgba(59, 130, 246, 0.15);
      color: var(--accent-blue);
      border-color: var(--accent-blue);
    }

    .signal-neutral {
      background-color: rgba(148, 163, 184, 0.05);
      color: var(--text-muted);
    }

    .dashboard-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card h2 {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .metric-value {
      font-size: 1.25rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>Estrategia Táctica (EMA + RSI + OBV)</h1>
    <div class="controls">
      <select id="symbolSelect">
        <option value="SOLUSDT">Solana (SOL/USDT)</option>
        <option value="BTCUSDT">Bitcoin (BTC/USDT)</option>
        <option value="ETHUSDT">Ethereum (ETH/USDT)</option>
      </select>
      <button id="analyzeBtn">Actualizar</button>
    </div>
  </header>

  <div id="signalDisplay" class="signal-box signal-neutral">
    CARGANDO DATOS...
  </div>

  <div class="dashboard-grid">
    <div class="card">
      <h2>Precio Actual</h2>
      <div id="currentPrice" class="metric-value">--</div>
    </div>
    <div class="card">
      <h2>EMA 200 (Tendencia)</h2>
      <div id="currentEma" class="metric-value">--</div>
    </div>
    <div class="card">
      <h2>RSI (14)</h2>
      <div id="currentRsi" class="metric-value">--</div>
    </div>
  </div>

  <script src="js/indicators.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
