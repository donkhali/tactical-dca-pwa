<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tactical DCA Strategy PWA</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82f6">
</head>
<body>
  <header>
    <h1>Estrategia Táctica (EMA + RSI + OBV)</h1>
    <div class="controls">
      <select id="symbolSelect">
        <option value="BTCUSDT">Bitcoin (BTC/USDT)</option>
        <option value="ETHUSDT">Ethereum (ETH/USDT)</option>
        <option value="BNBUSDT">Binance Coin (BNB/USDT)</option>
      </select>
      <button id="analyzeBtn">Actualizar</button>
    </div>
  </header>

  <div id="signalDisplay" class="signal-box signal-neutral">
    CARGANDO DATOS DEL MERCADO...
  </div>

  <div class="dashboard-grid">
    <div class="card">
      <h2>Precio Actual (Cierre)</h2>
      <div id="currentPrice" class="metric-value">--</div>
    </div>
    <div class="card">
      <h2>EMA 200 (Tendencia)</h2>
      <div id="currentEma" class="metric-value">--</div>
    </div>
    <div class="card">
      <h2>RSI (14)</h2>
      <div id="currentRsi" class="metric-value">--</div>
    </div>
  </div>

  <script src="js/indicators.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
