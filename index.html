<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solana Tactical DCA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <style>
    :root {
      --bg-main: #0a0a0c;
      --bg-card: #16161a;
      --text-main: #ffffff;
      --text-muted: #9ca3af;
      --solana-gradient: linear-gradient(135deg, #00FFA3 0%, #DC1FFF 100%);
      --accent-green: #00FFA3;
      --accent-purple: #DC1FFF;
      --border: #26262b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    h1 {
      font-size: 1.35rem;
      text-align: center;
      background: var(--solana-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-card);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .asset-title {
      font-weight: bold;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      background: var(--solana-gradient);
      border-radius: 50%;
    }

    button {
      background: var(--solana-gradient);
      color: #000000;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .signal-box {
      text-align: center;
      padding: 20px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 20px;
      border: 2px solid var(--border);
    }

    .signal-dca {
      background-color: rgba(0, 255, 163, 0.1);
      color: var(--accent-green);
      border-color: var(--accent-green);
    }

    .signal-sell {
      background-color: rgba(220, 31, 255, 0.1);
      color: var(--accent-purple);
      border-color: var(--accent-purple);
    }

    .signal-neutral {
      background-color: rgba(156, 163, 175, 0.05);
      color: var(--text-muted);
    }

    .dashboard-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card h2 {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .metric-value {
      font-size: 1.25rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>Estrategia Táctica Solana</h1>
    <div class="controls">
      <span class="asset-title"><span class="dot"></span> SOL / USD</span>
      <button id="analyzeBtn">Actualizar</button>
    </div>
  </header>

  <div id="signalDisplay" class="signal-box signal-neutral">
    CARGANDO DATOS...
  </div>

  <div class="dashboard-grid">
    <div class="card">
      <h2>Precio Actual</h2>
      <div id="currentPrice" class="metric-value">--</div>
    </div>
    <div class="card">
      <h2>EMA 200 (Tendencia)</h2>
      <div id="currentEma" class="metric-value">--</div>
    </div>
    <div class="card">
      <h2>RSI (14)</h2>
      <div id="currentRsi" class="metric-value">--</div>
    </div>
  </div>

  <script src="js/indicators.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
