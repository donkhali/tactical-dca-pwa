name: SOLANA Tactical Scanner

on:
  schedule:
    - cron: '0 */4 * * x'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependencias
        run: npm install

      - name: Ejecutar Scanner de Solana
        run: npm start
